[build-system]
requires = ["setuptools>=61", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-notifier"
dynamic = ["version"]
description = "Snapmaker U1 Alert Notifier - Moonraker WebSocket to Discord notification service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Snapmaker U1" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "websockets>=11.0.3",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "structlog>=23.2.0",
    "colorama>=0.4.6",
    "aiohttp>=3.9.1",
]

[project.scripts]
u1-notifier = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools_scm]
# Docker builds have no .git: pass SETUPTOOLS_SCM_PRETEND_VERSION instead
fallback_version = "0.0.0"
