{{- if not .Values.printer.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "u1-notifier.fullname" . }}
  labels:
    {{- include "u1-notifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  MOONRAKER_API_KEY: {{ .Values.printer.apiKey | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.printer.discordWebhookUrl | quote }}
{{- end }}
